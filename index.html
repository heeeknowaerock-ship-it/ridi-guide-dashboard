<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>리디 가이드 점검기</title>
  <style>
    :root { --ink:#172033; --muted:#667085; --line:#dce3ed; --blue:#2868ff; --blue-soft:#edf3ff; --red:#c93c4a; --red-soft:#fff0f1; --amber:#9a6510; --amber-soft:#fff7e6; --green:#147a55; --green-soft:#eaf9f2; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f6f8fb; color:var(--ink); font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif; }
    button, textarea { font:inherit; }
    .shell { max-width:1440px; margin:0 auto; padding:36px 24px 60px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:24px; }
    h1 { margin:0 0 8px; font-size:30px; letter-spacing:-.04em; }
    .lead { margin:0; color:var(--muted); }
    .status-pill { padding:9px 13px; border:1px solid #cfe0ff; background:var(--blue-soft); color:#174dbf; border-radius:999px; font-weight:700; font-size:13px; white-space:nowrap; }
    .workspace { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:0 10px 35px rgba(30,50,90,.06); overflow:hidden; }
    .card-head { display:flex; justify-content:space-between; align-items:center; padding:18px 20px; border-bottom:1px solid var(--line); }
    .card-head h2 { margin:0; font-size:17px; }
    .card-head span { color:var(--muted); font-size:13px; }
    textarea { width:100%; min-height:420px; resize:vertical; border:0; outline:0; padding:22px; color:var(--ink); line-height:1.8; background:#fff; }
    #output { background:#fbfcff; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin:18px 0; }
    button { border:0; border-radius:10px; padding:12px 17px; cursor:pointer; font-weight:800; }
    .primary { background:var(--blue); color:#fff; }
    .secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
    button:hover { transform:translateY(-1px); }
    .results { padding:20px; margin-top:18px; }
    .result-top { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:14px; }
    .result-top h2 { margin:0; font-size:18px; }
    .summary { color:var(--muted); font-size:14px; }
    .empty { padding:28px; text-align:center; color:var(--muted); background:#fafbfc; border-radius:12px; }
    .issue { display:grid; grid-template-columns:86px 1fr; gap:14px; padding:15px 0; border-top:1px solid #edf0f5; }
    .issue:first-child { border-top:0; }
    .badge { width:max-content; height:max-content; padding:5px 9px; border-radius:999px; font-size:12px; font-weight:800; }
    .badge.fix { color:var(--green); background:var(--green-soft); }
    .badge.error { color:var(--red); background:var(--red-soft); }
    .badge.warning { color:var(--amber); background:var(--amber-soft); }
    .issue strong { display:block; margin-bottom:5px; }
    .issue p { margin:0; color:#475467; line-height:1.55; }
    .change { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; font-size:13px; }
    .change div { padding:10px; border-radius:8px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .before { background:var(--red-soft); color:#8f2430; }
    .after { background:var(--green-soft); color:#126747; }
    .toast { position:fixed; right:24px; bottom:24px; padding:13px 18px; border-radius:12px; background:#172033; color:#fff; opacity:0; transform:translateY(8px); pointer-events:none; transition:.2s; }
    .toast.show { opacity:1; transform:none; }
    @media (max-width:900px) { header{align-items:flex-start; flex-direction:column}.workspace{grid-template-columns:1fr}.change{grid-template-columns:1fr}.shell{padding:24px 14px 40px}textarea{min-height:330px} }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><h1>리디 가이드 점검기</h1><p class="lead">편집팀 원문을 붙여넣으면 접수양식 오류를 찾고, 제출용 형식으로 자동 교정합니다.</p></div>
      <div class="status-pill">접수양식 6개 항목 검사</div>
    </header>

    <section class="workspace">
      <article class="card">
        <div class="card-head"><h2>편집팀 원문</h2><span id="inputCount">0자</span></div>
        <textarea id="input" aria-label="편집팀 원문" placeholder="■ 접수양식부터 붙여넣어 주세요."></textarea>
      </article>
      <article class="card">
        <div class="card-head"><h2>자동 교정본</h2><span>리디 제출용</span></div>
        <textarea id="output" aria-label="자동 교정본" readonly placeholder="검사 결과가 여기에 표시됩니다."></textarea>
      </article>
    </section>

    <div class="actions">
      <button class="primary" id="inspect">검사하고 자동 교정</button>
      <button class="secondary" id="copy">교정본 복사</button>
      <button class="secondary" id="sample">오류 예시 불러오기</button>
      <button class="secondary" id="reset">초기화</button>
    </div>

    <section class="card results">
      <div class="result-top"><h2>점검 결과</h2><div class="summary" id="summary">원문을 입력한 뒤 검사해 주세요.</div></div>
      <div id="issues"><div class="empty">아직 검사하지 않았습니다.</div></div>
    </section>
  </main>
  <div class="toast" id="toast"></div>

  <script type="module">
    import { inspectGuide } from './guide-rules.mjs';
    const $ = (selector) => document.querySelector(selector);
    const input = $('#input');
    const output = $('#output');
    const issues = $('#issues');
    const summary = $('#summary');
    const toast = $('#toast');

    const escapeHtml = (value='') => value.replace(/[&<>"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));
    const showToast = (message) => { toast.textContent = message; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1700); };
    input.addEventListener('input', () => $('#inputCount').textContent = `${input.value.length.toLocaleString()}자`);

    function render() {
      if (!input.value.trim()) { showToast('원문을 먼저 입력해 주세요.'); input.focus(); return; }
      const result = inspectGuide(input.value);
      output.value = result.output;
      const errors = result.issues.filter((item) => item.type === 'error').length;
      const fixes = result.issues.filter((item) => item.type === 'fix').length;
      const warnings = result.issues.filter((item) => item.type === 'warning').length;
      summary.textContent = `필수 오류 ${errors}건 · 자동 수정 ${fixes}건 · 확인 필요 ${warnings}건`;

      if (!result.issues.length) {
        issues.innerHTML = '<div class="empty">접수양식에 맞습니다. 수정할 부분이 없습니다.</div>';
        return;
      }
      const labels = { error:'필수 오류', fix:'자동 수정', warning:'확인 필요' };
      issues.innerHTML = result.issues.map((item) => `
        <div class="issue">
          <span class="badge ${item.type}">${labels[item.type]}</span>
          <div><strong>${escapeHtml(item.field)}</strong><p>${escapeHtml(item.message)}</p>
          ${item.before !== undefined ? `<div class="change"><div class="before"><b>수정 전</b><br>${escapeHtml(item.before || '(빈값)')}</div>${item.after !== undefined ? `<div class="after"><b>수정 후</b><br>${escapeHtml(item.after || '(빈값)')}</div>` : ''}</div>` : ''}
          </div>
        </div>`).join('');
    }

    $('#inspect').addEventListener('click', render);
    $('#copy').addEventListener('click', async () => {
      if (!output.value) { showToast('먼저 검사를 실행해 주세요.'); return; }
      await navigator.clipboard.writeText(output.value); showToast('교정본을 복사했습니다.');
    });
    $('#sample').addEventListener('click', () => {
      input.value = `■ 접수양식\n* 배경/분야: 현대물 / 금단의관계\n* 작품 키워드: 양성구유수; 아빠바라기공; 더티토크; 강압플; 금단의관계\n* 남자주인공: 리디\n* 여자주인공: 로판\n* 이럴 때 보세요: 금단의 관계 속 진심이 보고 싶을 때\n* 공감 글귀: “결국 네가 아니면 안 됐어.”`;
      input.dispatchEvent(new Event('input')); render();
    });
    $('#reset').addEventListener('click', () => { input.value=''; output.value=''; issues.innerHTML='<div class="empty">아직 검사하지 않았습니다.</div>'; summary.textContent='원문을 입력한 뒤 검사해 주세요.'; input.dispatchEvent(new Event('input')); input.focus(); });
  </script>
</body>
</html>
